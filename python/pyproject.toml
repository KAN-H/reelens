[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelens-core"
version = "0.1.0"
description = "把视频/音频拆成结构化报告：镜头切分、抽帧、口播转写、节奏与音频测量"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "reelens contributors" }]
keywords = ["video", "breakdown", "shot-detection", "asr", "ffmpeg", "dsh"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
#: 核心依赖刻意保持为**零**：只用标准库 + 外部可执行文件（ffmpeg/ffprobe）。
#: 可选能力各自一组，装不上就 SKIPPED 并给出安装提示，不影响主流程。
dependencies = []

[project.optional-dependencies]
download = ["yt-dlp>=2024.1"]
asr = ["faster-whisper>=1.0"]
audio = ["librosa>=0.10"]
scenes = ["scenedetect>=0.7"]
images = ["pillow>=10"]
all = [
  "yt-dlp>=2024.1",
  "faster-whisper>=1.0",
  "librosa>=0.10",
  "scenedetect>=0.7",
  "pillow>=10",
]

[project.scripts]
reelens = "reelens.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
