name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # 同一分支连续推送时，取消还在跑的旧一轮，省 runner 也避免"绿的是旧提交"的错觉
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Windows runner 默认 cp1252，本项目的中文提示/报告会直接 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install -e "python[scenes,images]" pytest

      - name: Unit tests (no network, no ffmpeg needed)
        run: python -m pytest python/tests -q

      - name: CLI self-check
        run: |
          # `probe` 没有 --json 参数（它本来只输出 JSON），且可选依赖缺失时返回非零——
          # 所以这里允许非零退出，改为**校验输出内容**，别用 `|| true` 把真错误一起吞掉。
          # python/tests/test_cli_surface.py 会把这条命令与 CLI 的真实参数面比对，
          # 以后写错 flag 会在单测阶段就红，而不是等这里。
          python -m reelens.cli --help
          python -m reelens.cli probe > probe.json || true
          python -c "import json; d = json.load(open('probe.json', encoding='utf-8')); assert d.get('tools'), 'probe reported no tools'; print('probe ok:', ', '.join(d['tools']))"

  wheel:
    name: build + install sdist/wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Install the wheel in a clean venv and smoke it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/venv/bin/python -m pip install --quiet python/dist/*.whl
          /tmp/venv/bin/python -m reelens.cli --help
          /tmp/venv/bin/python -c "import reelens, pathlib; print('import ok:', pathlib.Path(reelens.__file__).parent.name)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  node:
    name: plugin contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check lib/capabilities.js

      - name: Host contract tests
        run: node test-host.mjs

      - name: Client bundle contract tests
        run: node test-client.mjs

      - name: Load smoke (registers 6 tools + 7 routes against a fake context)
        run: node test-load.mjs

      - name: PTC contract (canonical JSON, no prose parsing, no side effects)
        run: node test-ptc.mjs

  package:
    name: package manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate package.json / locale / icon
        run: |
          node -e "
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          for (const key of ['index.js','client.js','cordis.patch.yml','icon.svg','README.md']) {
            if (!fs.existsSync(key)) throw new Error('missing '+key);
          }
          if (!pkg.exports['./client']) throw new Error('missing ./client export');
          if (!pkg.dsh || pkg.dsh.client.platform !== 'web') throw new Error('dsh.client.platform must be web');
          for (const file of ['locale/en.json','locale/zh.json']) {
            const doc=JSON.parse(fs.readFileSync(file,'utf8'));
            if (!doc.meta || !doc.meta.title || !doc.meta.description) throw new Error(file+' missing meta');
          }
          console.log('manifest ok');
          "